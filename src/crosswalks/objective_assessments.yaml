# objective_assessments - 20 C2D2 adult CDEs (17 mapped, 3 unmapped)
# source_type unmapped = deactivated CDE: no output column until it is mapped

- c2d2_name: icu_24hr_fio2_max
  source_type: derived
  clif_table: respiratory_support
  clif_category_column: null
  clif_category_value: null
  clif_value_column: fio2_set
  clif_time_column: recorded_dttm
  aggregation: max
  time_window: icu_first_24h
  output_type: float
  note: CLIF fio2_set is a fraction (0.21-1); C2D2 unit is %

- c2d2_name: icu_24hr_sfratio_min
  source_type: unmapped
  output_type: float
  reason: needs custom SpO2/FiO2 asof-join logic (like P/F ratio)

- c2d2_name: icu_24hr_pfratio_min
