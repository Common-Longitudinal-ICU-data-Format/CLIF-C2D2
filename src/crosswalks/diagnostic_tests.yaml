# diagnostic_tests - 28 C2D2 adult CDEs (22 mapped, 6 unmapped)
# source_type unmapped = deactivated CDE: no output column until it is mapped

- c2d2_name: icu_24hr_hct_max
  source_type: unmapped
  output_type: float
  clif_status: clif_gap
  reason: no hematocrit lab_category in CLIF

- c2d2_name: icu_24hr_hgb_max
  source_type: derived
  clif_table: labs
  clif_category_column: lab_category
  clif_category_value: hemoglobin
  clif_value_column: lab_value_numeric
  clif_time_column: lab_result_dttm
  aggregation: max
  time_window: icu_first_24h
  output_type: float

