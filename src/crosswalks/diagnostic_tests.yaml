# culture "any" CDEs: whether a culture of the given fluid was COLLECTED in
# the first 24h of ICU (C2D2 REDCap spec). If the site's microbiology_culture
# table is absent, or it lacks the requested fluid_category, the column is
# emitted as all-null (not assessed) rather than 0.
- c2d2_name: icu_24hr_culture_blood_any
  source_type: derived
  clif_table: microbiology_culture
  clif_category_column: fluid_category
  clif_value_column: fluid_category
  clif_category_value: blood_buffy
  clif_time_column: collect_dttm
  aggregation: any
  time_window: icu_first_24h
  output_type: binary

- c2d2_name: icu_24hr_culture_urine_any
  source_type: derived
  clif_table: microbiology_culture
  clif_category_column: fluid_category
  clif_value_column: fluid_category
  clif_category_value: genito_urinary_tract
  clif_time_column: collect_dttm
  aggregation: any
  time_window: icu_first_24h
  output_type: binary
